<title>Aprenda Inglês</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: #F4EFE4;
    color: #2B3A42;
  }
  #app { max-width: 720px; margin: 0 auto; padding: 24px 20px 60px; }

  .cover {
    background: #2B3A42;
    color: #F4EFE4;
    border-radius: 14px;
    padding: 28px 24px;
    margin-bottom: 22px;
    position: relative;
    overflow: hidden;
  }
  .cover::before {
    content: "";
    position: absolute;
    inset: 8px;
    border: 1px solid rgba(200,155,60,0.55);
    border-radius: 8px;
    pointer-events: none;
  }
  .cover h1 {
    margin: 0 0 4px;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .cover p { margin: 0; color: #C89B3C; font-size: 16px; }

  .progress-wrap { margin: 18px 0 26px; }
  .progress-bar {
    height: 10px;
    background: rgba(43,58,66,0.12);
    border-radius: 6px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: #C1440E;
    transition: width 0.4s ease;
  }
  .progress-label { font-size: 15px; color: #5c6b71; margin-top: 6px; }

  .lesson-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
  .lesson-card {
    background: #fff;
    border: 1px solid rgba(43,58,66,0.12);
    border-radius: 12px;
    padding: 14px 14px;
    cursor: pointer;
    text-align: left;
    transition: border-color 0.15s, transform 0.1s;
  }
  .lesson-card:hover { border-color: #C1440E; }
  .lesson-card:active { transform: scale(0.98); }
  .lesson-card.done { background: #F1F7F0; border-color: #3D7068; }
  .lesson-card.locked { opacity: 0.45; cursor: not-allowed; }
  .lesson-num {
    display: inline-flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; border-radius: 50%;
    background: #2B3A42; color: #F4EFE4; font-size: 14px; font-weight: 700;
    margin-bottom: 8px;
  }
  .lesson-card.done .lesson-num { background: #3D7068; }
  .lesson-title { font-size: 17px; font-weight: 600; margin: 0 0 2px; }
  .lesson-sub { font-size: 14px; color: #7a7a75; margin: 0; }
  .lesson-check { float: right; color: #3D7068; font-weight: 700; font-size: 18px; }
  .lesson-card.recommended { border-color: #C89B3C; border-width: 2px; }
  .lesson-badge {
    position: absolute; top: -9px; right: 10px;
    background: #C89B3C; color: #2B3A42; font-size: 10px; font-weight: 700;
    padding: 2px 8px; border-radius: 10px; text-transform: uppercase; letter-spacing: 0.5px;
  }
  .lesson-card { position: relative; }
  .pace-note { font-size: 13px; color: #7a7a75; text-align: center; margin: 0 0 16px; }

  .lesson-view { background: #fff; border-radius: 14px; padding: 22px; border: 1px solid rgba(43,58,66,0.12); }
  .back-btn {
    background: none; border: none; color: #C1440E; font-size: 16px; font-weight: 600;
    cursor: pointer; padding: 0 0 14px; display: block;
  }
  .lesson-view h2 { margin: 0 0 4px; font-size: 24px; }
  .lesson-view .lesson-sub { margin-bottom: 18px; font-size: 15px; }

  .card {
    perspective: 800px;
    height: 150px;
    margin-bottom: 12px;
    cursor: pointer;
  }
  .card-inner {
    position: relative; width: 100%; height: 100%;
    transition: transform 0.5s;
    transform-style: preserve-3d;
  }
  .card.flipped .card-inner { transform: rotateY(180deg); }
  .card-face {
    position: absolute; inset: 0;
    backface-visibility: hidden;
    border-radius: 10px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 10px;
    text-align: center;
  }
  .card-front { background: #F4EFE4; border: 1px solid rgba(43,58,66,0.15); }
  .card-back { background: #2B3A42; color: #F4EFE4; transform: rotateY(180deg); }
  .card-en { font-size: 24px; font-weight: 700; }
  .card-pron { font-size: 15px; color: #C89B3C; margin-top: 4px; }
  .card-pt { font-size: 21px; font-weight: 600; }
  .card-hint { font-size: 13px; color: #7a7a75; margin-top: 8px; }
  .card-back .card-hint { color: rgba(244,239,228,0.6); }

  .speak-btn {
    position: absolute; top: 8px; right: 8px;
    width: 34px; height: 34px; border-radius: 50%;
    background: rgba(43,58,66,0.08); border: none;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; cursor: pointer;
  }
  .speak-btn:hover { background: rgba(43,58,66,0.16); }

  .cards-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 22px; }

  .quiz-box { border-top: 1px solid rgba(43,58,66,0.12); padding-top: 18px; margin-top: 6px; }
  .quiz-box h3 { font-size: 18px; margin: 0 0 12px; }
  .quiz-q { font-size: 17px; margin-bottom: 10px; font-weight: 600; }
  .quiz-options { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .quiz-opt {
    text-align: left; padding: 12px 14px; border-radius: 8px;
    border: 1px solid rgba(43,58,66,0.15); background: #fff;
    cursor: pointer; font-size: 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .quiz-opt-speak {
    font-size: 15px; opacity: 0.55; flex-shrink: 0; padding: 2px 4px;
  }
  .quiz-opt-speak:hover { opacity: 1; }
  .quiz-opt:hover { border-color: #C1440E; }
  .quiz-opt.correct { background: #E6F1EA; border-color: #3D7068; color: #244a3d; }
  .quiz-opt.wrong { background: #FBE9E6; border-color: #C1440E; color: #7a2a17; }
  .quiz-feedback { font-size: 15px; margin-bottom: 14px; min-height: 18px; }
  .quiz-feedback.ok { color: #3D7068; font-weight: 600; }
  .quiz-feedback.bad { color: #C1440E; font-weight: 600; }
  .next-btn, .complete-btn {
    background: #C1440E; color: #fff; border: none; border-radius: 8px;
    padding: 12px 20px; font-size: 16px; font-weight: 600; cursor: pointer;
  }
  .next-btn:disabled { background: #d9c9b8; cursor: not-allowed; }
  .complete-btn { background: #3D7068; }

  .error-text { color: #C1440E; font-size: 13px; margin: -4px 0 10px; }

  .empty-note { font-size: 12px; color: #7a7a75; text-align: center; margin-top: 4px; }

  .login-wrap { max-width: 340px; margin: 40px auto 0; }
  .login-wrap h2 { font-size: 20px; margin-bottom: 4px; }
  .login-wrap p.sub { font-size: 14px; color: #5c6b71; margin-bottom: 18px; }
  .login-field { margin-bottom: 12px; }
  .login-field label { display: block; font-size: 13px; margin-bottom: 4px; color: #5c6b71; }
  .login-field input {
    width: 100%; padding: 10px 12px; border-radius: 8px;
    border: 1px solid rgba(43,58,66,0.2); font-size: 15px;
  }
  .login-btn {
    width: 100%; background: #C1440E; color: #fff; border: none;
    border-radius: 8px; padding: 12px; font-size: 15px; font-weight: 600;
    cursor: pointer; margin-top: 6px;
  }
  .login-toggle {
    text-align: center; margin-top: 14px; font-size: 13px; color: #5c6b71;
  }
  .login-toggle button { background: none; border: none; color: #C1440E; font-weight: 600; cursor: pointer; padding: 0; }
  .login-error { color: #C1440E; font-size: 13px; margin: 6px 0; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .top-bar .user-email { font-size: 12px; color: #7a7a75; }
  .logout-btn { background: none; border: none; color: #5c6b71; font-size: 12px; text-decoration: underline; cursor: pointer; }
  .sync-note { font-size: 11px; color: #7a7a75; text-align: center; margin-top: 4px; }

let state = {
  screen: "loading",
  currentLesson: null,
  cardFlips: {},
  quizIndex: 0,
  quizAnswered: null,
  completed: {},
  session: null,
  authMode: "login",
  authError: "",
};

async function init() {
  const { data } = await sb.auth.getSession();
  if (data.session) {
    state.session = data.session;
    state.screen = "home";
    await loadProgress();
  } else {
    state.screen = "auth";
    render();
  }
}

async function loadProgress() {
  try {
    const { data, error } = await sb
      .from("ingles_progress")
      .select("lesson_id, completed")
      .eq("user_id", state.session.user.id);
    if (!error && data) {
      state.completed = {};
      data.forEach(row => { if (row.completed) state.completed[row.lesson_id] = true; });
    }
  } catch (e) {}
  render();
}

async function saveProgress(lessonId) {
  try {
    await sb.from("ingles_progress").upsert({
      user_id: state.session.user.id,
      lesson_id: lessonId,
      completed: true,
      updated_at: new Date().toISOString(),
    }, { onConflict: "user_id,lesson_id" });
  } catch (e) {}
}

async function handleAuthSubmit(evt) {
  evt.preventDefault();
  const email = document.getElementById("auth-email").value.trim();
  const password = document.getElementById("auth-password").value;
  state.authError = "";
  if (!email || !password) {
    state.authError = "Preencha e-mail e senha.";
    render();
    return;
  }
  if (password.length < 6) {
    state.authError = "A senha precisa ter pelo menos 6 caracteres.";
    render();
    return;
  }
  let result;
  if (state.authMode === "login") {
    result = await sb.auth.signInWithPassword({ email, password });
  } else {
    result = await sb.auth.signUp({ email, password });
  }
  if (result.error) {
    state.authError = result.error.message;
    render();
    return;
  }
  if (state.authMode === "signup" && !result.data.session) {
    state.authError = "Conta criada! Verifique seu e-mail para confirmar antes de entrar.";
    render();
    return;
  }
  state.session = result.data.session;
  state.screen = "home";
  await loadProgress();
}

function toggleAuthMode() {
  state.authMode = state.authMode === "login" ? "signup" : "login";
  state.authError = "";
  render();
}

async function logout() {
  await sb.auth.signOut();
  state.session = null;
  state.completed = {};
  state.screen = "auth";
  render();
}

let cachedVoices = [];
function loadVoices() {
  cachedVoices = window.speechSynthesis.getVoices();
}
if (window.speechSynthesis) {
  window.speechSynthesis.onvoiceschanged = loadVoices;
  loadVoices();
}

function pickVoice() {
  if (!cachedVoices.length) cachedVoices = window.speechSynthesis.getVoices();
  const enVoices = cachedVoices.filter(v => v.lang && v.lang.toLowerCase().startsWith("en"));
  const preferredNames = ["Google US English", "Microsoft Aria", "Microsoft Jenny", "Microsoft Guy", "Samantha", "Alex", "Daniel"];
  for (const name of preferredNames) {
    const v = enVoices.find(v => v.name.includes(name));
    if (v) return v;
  }
  const us = enVoices.find(v => v.lang.toLowerCase() === "en-us");
  return us || enVoices[0] || null;
}

function speak(text, evt) {
  if (evt) evt.stopPropagation();
  try {
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = "en-US";
    const voice = pickVoice();
    if (voice) utter.voice = voice;
    utter.rate = 0.92;
    utter.pitch = 1;
    window.speechSynthesis.speak(utter);
  } catch (e) {}
}

function openLesson(id) {
  state.screen = "lesson";
  state.currentLesson = id;
  state.cardFlips = {};
  state.quizIndex = 0;
  state.quizAnswered = null;
  render();
}

function goHome() {
  state.screen = "home";
  render();
}

function flipCard(i) {
  state.cardFlips[i] = !state.cardFlips[i];
  render();
}

function answerQuiz(optIndex) {
  if (state.quizAnswered !== null) return;
  state.quizAnswered = optIndex;
  render();
}

function nextQuiz() {
  const lesson = LESSONS.find(l => l.id === state.currentLesson);
  if (state.quizIndex < lesson.quiz.length - 1) {
    state.quizIndex++;
    state.quizAnswered = null;
    render();
  } else {
    state.completed[state.currentLesson] = true;
    saveProgress(state.currentLesson);
    state.screen = "home";
    render();
  }
}

function renderHome() {
  const total = LESSONS.length;
  const done = Object.keys(state.completed).filter(k => state.completed[k]).length;
  const pct = Math.round((done / total) * 100);
  const nextLesson = LESSONS.find(l => !state.completed[l.id]);

  let cardsHtml = "";
  LESSONS.forEach((lesson, i) => {
    const isDone = !!state.completed[lesson.id];
    const isNext = nextLesson && lesson.id === nextLesson.id;
    cardsHtml += `
      <button class="lesson-card ${isDone ? "done" : ""} ${isNext ? "recommended" : ""}" onclick="openLesson('${lesson.id}')">
        ${isDone ? '<span class="lesson-check">&#10003;</span>' : ""}
        ${isNext ? '<span class="lesson-badge">Hoje</span>' : ""}
        <div class="lesson-num">${i + 1}</div>
        <p class="lesson-title">${lesson.title}</p>
        <p class="lesson-sub">${lesson.sub}</p>
      </button>
    `;
  });

  document.getElementById("app").innerHTML = `
    <div class="cover">
      <h1>Aprenda Inglês</h1>
      <p>Do zero, passo a passo &mdash; vocabulário e gramática básica</p>
    </div>
    <div class="top-bar">
      <span class="user-email">${state.session.user.email}</span>
      <button class="logout-btn" onclick="logout()">Sair</button>
    </div>
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <p class="progress-label">${done} de ${total} lições concluídas (${pct}%)</p>
    </div>
    <p class="pace-note">${nextLesson ? `Sugestão: ~15 min hoje (1 lição). Com mais tempo, sinta-se à vontade pra fazer mais.` : "Você concluiu todas as lições disponíveis!"}</p>
    <div class="lesson-grid">${cardsHtml}</div>
    <p class="sync-note">Seu progresso sincroniza entre qualquer aparelho, desde que você entre com o mesmo e-mail.</p>
  `;
}

function renderLesson() {
  const lesson = LESSONS.find(l => l.id === state.currentLesson);
  let cardsHtml = "";
  lesson.cards.forEach((c, i) => {
    const flipped = state.cardFlips[i] ? "flipped" : "";
    cardsHtml += `
      <div class="card ${flipped}" onclick="flipCard(${i})">
        <div class="card-inner">
          <div class="card-face card-front">
            <button class="speak-btn" onclick="speak('${c.en.replace(/'/g, "\\'")}', event)" aria-label="Ouvir pronúncia">&#128266;</button>
            <div class="card-en">${c.en}</div>
            <div class="card-pron">${c.pron}</div>
            <div class="card-hint">toque para traduzir</div>
          </div>
          <div class="card-face card-back">
            <div class="card-pt">${c.pt}</div>
            <div class="card-hint">toque para voltar</div>
          </div>
        </div>
      </div>
    `;
  });

  const q = lesson.quiz[state.quizIndex];
  let optsHtml = "";
  q.options.forEach((opt, i) => {
    let cls = "";
    if (state.quizAnswered !== null) {
      if (i === q.correct) cls = "correct";
      else if (i === state.quizAnswered) cls = "wrong";
    }
    optsHtml += `<button class="quiz-opt ${cls}" onclick="answerQuiz(${i})"><span>${opt}</span><span class="quiz-opt-speak" onclick="speak('${opt.replace(/'/g, "\\'")}', event)">&#128266;</span></button>`;
  });

  let feedback = "";
  if (state.quizAnswered !== null) {
    if (state.quizAnswered === q.correct) {
      feedback = `<p class="quiz-feedback ok">Isso mesmo!</p>`;
    } else {
      feedback = `<p class="quiz-feedback bad">Quase &mdash; a resposta certa está em verde.</p>`;
    }
  } else {
    feedback = `<p class="quiz-feedback"></p>`;
  }

  const isLast = state.quizIndex === lesson.quiz.length - 1;
  const btnLabel = isLast ? "Concluir lição" : "Próxima pergunta";
  const btnClass = isLast ? "complete-btn" : "next-btn";

  document.getElementById("app").innerHTML = `
    <button class="back-btn" onclick="goHome()">&larr; Voltar às lições</button>
    <div class="lesson-view">
      <h2>${lesson.title}</h2>
      <p class="lesson-sub">${lesson.sub}</p>
      <div class="cards-grid">${cardsHtml}</div>
      <div class="quiz-box">
        <h3>Teste rápido (${state.quizIndex + 1}/${lesson.quiz.length})</h3>
        <p class="quiz-q">${q.q}</p>
        <div class="quiz-options">${optsHtml}</div>
        ${feedback}
        <button class="${btnClass}" onclick="nextQuiz()" ${state.quizAnswered === null ? "disabled" : ""}>${btnLabel}</button>
      </div>
    </div>
  `;
}

function renderLoading() {
  document.getElementById("app").innerHTML = `
    <div class="cover">
      <h1>Aprenda Inglês</h1>
      <p>Carregando...</p>
    </div>
  `;
}

function renderAuth() {
  const isLogin = state.authMode === "login";
  document.getElementById("app").innerHTML = `
    <div class="cover">
      <h1>Aprenda Inglês</h1>
      <p>Do zero, passo a passo &mdash; vocabulário e gramática básica</p>
    </div>
    <div class="login-wrap">
      <h2>${isLogin ? "Entrar" : "Criar conta"}</h2>
      <p class="sub">${isLogin ? "Use seu e-mail e senha para acessar seu progresso." : "Crie uma conta para você e sua esposa terem progresso separado."}</p>
      <form id="auth-form">
        <div class="login-field">
          <label>E-mail</label>
          <input type="email" id="auth-email" placeholder="seu@email.com" autocomplete="email" />
        </div>
        <div class="login-field">
          <label>Senha</label>
          <input type="password" id="auth-password" placeholder="Mínimo 6 caracteres" autocomplete="${isLogin ? "current-password" : "new-password"}" />
        </div>
        ${state.authError ? `<p class="login-error">${state.authError}</p>` : ""}
        <button type="submit" class="login-btn">${isLogin ? "Entrar" : "Criar conta"}</button>
      </form>
      <div class="login-toggle">
        ${isLogin ? "Ainda não tem conta?" : "Já tem conta?"}
        <button onclick="toggleAuthMode()">${isLogin ? "Criar conta" : "Entrar"}</button>
      </div>
    </div>
  `;
  document.getElementById("auth-form").addEventListener("submit", handleAuthSubmit);
}

function render() {
  if (state.screen === "loading") renderLoading();
  else if (state.screen === "auth") renderAuth();
  else if (state.screen === "home") renderHome();
  else renderLesson();
}

init();
